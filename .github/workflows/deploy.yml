name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: GitHub Pages yapılandır
        uses: actions/configure-pages@v5

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Astro ile derle
        run: ASTRO_TELEMETRY_DISABLED=1 npm run build
        env:
          PUBLIC_WAITLIST_ENDPOINT: ${{ vars.PUBLIC_WAITLIST_ENDPOINT }}
          PUBLIC_WAITLIST_EMAIL: ${{ vars.PUBLIC_WAITLIST_EMAIL }}

      - name: Pages artefaktını hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayımla
        id: deployment
        uses: actions/deploy-pages@v4
